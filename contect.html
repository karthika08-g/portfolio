<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

</html>
<div class="container">
    <div class="section-one">
        <h1 class="section-one__name">Karthika </h1>
        <p class="section-one__role">Web developer</p>
        <a class="section-one__contect" href="index.html">Home</a>
    </div>
    <div class="contect-form">
        <table>
            <form>
                <tr>
                    <td>
                        Name:
                    </td>
                    <td>
                        <input type="text" placeholder="Your name" class="contect-form__index">
                    </td>
                </tr>
                <tr>
                    <td>
                        Email:
                    </td>
                    <td>
                        <input type="email" placeholder="your email" class="contect-form__index">
                    </td>
                </tr>
                <tr>
                    <td>
                        Message:
                    </td>
                    <td>
                        <textarea placeholder="message" class="contect-form__textarea"></textarea>
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="submit" class="contect-form__submit">
                    </td>
                </tr>
            </form>
        </table>
    </div>



    <div class="section-five">
        <p class="section-five__media">social media:
            <a href=""> Linkedin</a>
            <a href="">Github</a>
        </p>
        <p>&copy; Karthika </p>
    </div>
</div>
